<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Изображения с ответами</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #121212;
    color: #e0e0e0;
  }
  h1 {
    color: #ffffff;
    text-align: center;
  }
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .item {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.7);
  }
  .item img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 10px;
    border-radius: 4px;
  }
  .caption {
    font-weight: bold;
    font-size: 18px;
    color: #f0f0f0;
  }
</style>
</head>
<body>

<h1>Тест 7_2</h1>

<div class="gallery">
  <div class="item"><img src="images/img1.jpg" alt="img1"><div class="caption">img1 — (2)</div></div>
  <div class="item"><img src="images/img2.jpg" alt="img2"><div class="caption">img2 — (3)</div></div>
  <div class="item"><img src="images/img3.jpg" alt="img3"><div class="caption">img3 — (4)</div></div>
  <div class="item"><img src="images/img4.jpg" alt="img4"><div class="caption">img4 — (1)</div></div>
  <div class="item"><img src="images/img5.jpg" alt="img5"><div class="caption">img5 — (4)</div></div>
  <div class="item"><img src="images/img6.jpg" alt="img6"><div class="caption">img6 — (5)</div></div>
  <div class="item"><img src="images/img7.jpg" alt="img7"><div class="caption">img7 — (1)</div></div>
  <div class="item"><img src="images/img8.jpg" alt="img8"><div class="caption">img8 — (1)</div></div>
  <div class="item"><img src="images/img9.jpg" alt="img9"><div class="caption">img9 — (3)</div></div>
  <div class="item"><img src="images/img10.jpg" alt="img10"><div class="caption">img10 — (2)</div></div>
  <div class="item"><img src="images/img11.jpg" alt="img11"><div class="caption">img11 — (5)</div></div>

</div>

</body>
</html>
