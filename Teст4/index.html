<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Изображения с ответами</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #121212;
    color: #e0e0e0;
  }
  h1 {
    color: #ffffff;
  }
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .item {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
  }
  .item img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 10px;
    border-radius: 4px;
  }
  .caption {
    font-weight: bold;
    font-size: 18px;
    color: #f0f0f0;
  }
  .number {
    color: #aaaaaa;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1 style="text-align:center;">Галерея</h1>

<div class="gallery">
  <div class="item"><img src="images/img1.jpg" alt="img1"><div class="caption">img1 — (1)</div></div>
